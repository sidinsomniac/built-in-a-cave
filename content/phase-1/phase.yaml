phase: 1
title: The Cave
arc: Dark Keynote
summary: How the web actually works - from a click to a pixel, from scratch.
theme: { accent: "#ff5a3c", accent2: "#ffc861", glow: "#3a1410" }
intro:
  - who: narrator
    line: The Stark Expo. Ten thousand people in the hall, forty million watching online. Tony raises a hand - and the Expo app goes dark. Everywhere.
  - who: narrator
    line: Then the lights die too. Somewhere below the stage, a blast door slams shut.
  - who: tony
    line: (on a crackling line) Tony Stark. I'm locked in the server vault, in the dark. You're the new engineer? Great. You're my favourite person now.
  - who: jarvis
    line: Good evening. I'll patch you into the vault terminal. I won't do the work for you - I'll only ask questions.
  - who: jarvis
    line: First question. Why can't anyone on Earth reach the Expo?
