id: p1-l02
phase: 1
order: 2
number: 2
title: "The Plumbing: IP, Packets and Ports"
location: The network closet
concepts: [IP addresses, packets, routing, ports, localhost]
exercises: [warmup, core, outstanding]
scene:
  - who: jarvis
    line: The phones send requests. The question now is where those requests actually go.
  - who: tony
    line: To us. Obviously. We are the Expo.
  - who: happy
    line: I tried the Expo address from my laptop. Something answered. Something rude.
  - who: tony
    line: Our servers are many things, Happy. Rude isn't one of them.
  - who: jarvis
    line: Then let's follow one packet, hop by hop, and see whose door it knocks on.
clue: The Expo's packets are addressed to **an IP address that isn't ours**.
outro:
  - who: jarvis
    line: Every packet is addressed correctly, sir - to an address that is not ours.
  - who: tony
    line: Then something is handing out the wrong address.
  - who: peter
    line: Like a phone book with a typo?
  - who: jarvis
    line: Like a phone book someone edited, Mr Parker.
